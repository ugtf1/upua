name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - master

env:
  PROJECT_ID: top-cedar-471512-k3
  GAR_LOCATION: us-east1
  REPOSITORY: upua
  SERVICE: upua-portal
  REGION: us-east1
  SERVICE_ACCOUNT: upua-deploy@top-cedar-471512-k3.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: top-cedar-471512-k3:us-east1:upuadb

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Build Docker image → Artifact Registry → Deploy to Cloud Run
  # (Database migrations run natively inside the container on Cloud Run)
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keyless auth via Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # Clean/URL-encode any special characters in DATABASE_URL for Cloud Run
      - name: Prepare sanitized DATABASE_URL
        id: db_prep
        env:
          RAW_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          CLEAN_URL=$(node -e "
            const raw = process.env.RAW_DATABASE_URL || '';
            const match = raw.match(/^(postgres(?:ql)?:\/\/)([^:]+):(.*)@([^@\/]+)(\/.*)$/);
            if (!match) {
              console.log(raw);
              process.exit(0);
            }
            const [, protocol, user, pass, host, pathAndQuery] = match;
            const encodedUser = encodeURIComponent(decodeURIComponent(user));
            const encodedPass = encodeURIComponent(decodeURIComponent(pass));
            console.log(protocol + encodedUser + ':' + encodedPass + '@' + host + pathAndQuery);
          ")
          echo "url=${CLEAN_URL}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }} \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:latest \
            .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --memory=1Gi
            --cpu=1
            --min-instances=0
            --max-instances=10
            --port=8080
            --add-cloudsql-instances=${{ env.CLOUD_SQL_INSTANCE }}
          env_vars: |
            NODE_ENV=production
            DATABASE_URL=${{ steps.db_prep.outputs.url }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Show Cloud Run service URL
        run: |
          echo "✅ Deployed successfully!"
          gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)'
