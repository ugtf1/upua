# cloudbuild.yaml — Google Cloud Build trigger (alternative to GitHub Actions)
# Runs automatically when code is pushed to master via a Cloud Build GitHub trigger.
# Steps: migrate → build image → push → deploy to Cloud Run

steps:
  # 1. Install deps & run Prisma migrations against Cloud SQL
  - name: 'node:20-alpine'
    entrypoint: sh
    args:
      - '-c'
      - |
        (npm ci || npm install) && \
        npx prisma generate && \
        npx prisma migrate deploy
    env:
      - 'DATABASE_URL=$$DATABASE_URL'
    secretEnv: ['DATABASE_URL']

  # 2. Build the production container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/upua/upua-portal:$COMMIT_SHA'
      - '-t'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/upua/upua-portal:latest'
      - '.'

  # 3. Push to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-east1-docker.pkg.dev/$PROJECT_ID/upua/upua-portal:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-east1-docker.pkg.dev/$PROJECT_ID/upua/upua-portal:latest']

  # 4. Deploy the container to Cloud Run (with Cloud SQL, Gemini & all secrets)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'upua-portal'
      - '--image'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/upua/upua-portal:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--port=8080'
      - '--add-cloudsql-instances=top-cedar-471512-k3:us-east1:upuadb'
      - '--set-env-vars=NODE_ENV=production'
      - '--update-secrets=DATABASE_URL=upua-database-url:latest,AUTH_SECRET=upua-auth-secret:latest,GEMINI_API_KEY=upua-gemini-api-key:latest,STRIPE_SECRET_KEY=upua-stripe-secret-key:latest,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=upua-stripe-publishable-key:latest'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/upua-database-url/versions/latest
      env: 'DATABASE_URL'

images:
  - 'us-east1-docker.pkg.dev/$PROJECT_ID/upua/upua-portal:$COMMIT_SHA'
  - 'us-east1-docker.pkg.dev/$PROJECT_ID/upua/upua-portal:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
