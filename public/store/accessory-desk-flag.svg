<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072b1d"/>
      <stop offset="50%" stop-color="#0b3824"/>
      <stop offset="100%" stop-color="#03160e"/>
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5b3"/>
      <stop offset="35%" stop-color="#ffd54f"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997a15"/>
    </linearGradient>
    <linearGradient id="flagGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145a3c"/>
      <stop offset="100%" stop-color="#0b3323"/>
    </linearGradient>
    <filter id="shadow9" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="6" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg9)"/>

  <!-- Desk surface reflection -->
  <ellipse cx="400" cy="450" rx="260" ry="60" fill="#04180f" stroke="#0e442c" stroke-width="2"/>

  <!-- Flag and Stand Graphic -->
  <g filter="url(#shadow9)">
    <!-- Polished Weighted Brass Base -->
    <ellipse cx="400" cy="450" rx="90" ry="24" fill="url(#brass)"/>
    <ellipse cx="400" cy="442" rx="75" ry="18" fill="#fff5b3"/>
    <ellipse cx="400" cy="438" rx="60" ry="14" fill="url(#brass)"/>
    
    <!-- Vertical Brass Pole -->
    <rect x="394" y="90" width="12" height="350" rx="3" fill="url(#brass)"/>
    
    <!-- Top Finial / Spear / Royal Acorn -->
    <circle cx="400" cy="85" r="16" fill="url(#brass)"/>
    <polygon points="400,60 408,80 392,80" fill="url(#brass)"/>

    <!-- Silk Flag Draped from Pole -->
    <!-- Flag body with natural fabric wave curve -->
    <path d="M406,105 Q470,95 530,110 T650,105 L650,285 Q590,300 530,280 T406,290 Z" fill="url(#flagGreen)" stroke="url(#brass)" stroke-width="2"/>
    
    <!-- Gold Fringe border on flag edges -->
    <path d="M650,105 L650,285" stroke="#ffd54f" stroke-width="6" stroke-dasharray="4,4"/>
    <path d="M406,290 Q470,270 530,290 T650,285" stroke="#ffd54f" stroke-width="6" stroke-dasharray="4,4"/>

    <!-- Gold Embroidered Emblem on Flag -->
    <g transform="translate(515, 195)">
      <circle cx="0" cy="0" r="42" fill="#0b3323" stroke="url(#brass)" stroke-width="2.5"/>
      <polygon points="0,-26 8,-8 28,-5 13,9 18,28 0,18 -18,28 -13,9 -28,-5 -8,-8" fill="url(#brass)"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    </g>

    <!-- Golden Tassels hanging from finial -->
    <path d="M394,88 Q370,110 365,150" fill="none" stroke="url(#brass)" stroke-width="3"/>
    <polygon points="365,150 360,175 370,175" fill="url(#brass)"/>
  </g>

  <!-- Tag Pill -->
  <rect x="250" y="495" width="300" height="42" rx="21" fill="#000000" opacity="0.4"/>
  <rect x="250" y="495" width="300" height="42" rx="21" fill="none" stroke="#ffd54f" stroke-width="1.5"/>
  <text x="400" y="521" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffd54f" text-anchor="middle" letter-spacing="1">CEREMONIAL DESK BANNER</text>
</svg>
