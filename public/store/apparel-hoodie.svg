<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072b1d"/>
      <stop offset="50%" stop-color="#0b3824"/>
      <stop offset="100%" stop-color="#03160e"/>
    </linearGradient>
    <linearGradient id="hoodieBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145236"/>
      <stop offset="50%" stop-color="#0e3d26"/>
      <stop offset="100%" stop-color="#072617"/>
    </linearGradient>
    <linearGradient id="gold10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5b3"/>
      <stop offset="40%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="shadow10" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg10)"/>

  <!-- Halo backdrop -->
  <circle cx="400" cy="270" r="170" fill="#137459" opacity="0.3"/>

  <!-- Heavyweight Fleece Hoodie Graphic -->
  <g filter="url(#shadow10)">
    <!-- Hood shape behind -->
    <path d="M330,150 C330,80 470,80 470,150 Z" fill="#072517" stroke="#1d6645" stroke-width="2"/>
    <path d="M350,150 C350,105 450,105 450,150 Z" fill="#04180f"/>

    <!-- Drawstrings -->
    <path d="M375,170 Q370,220 365,260" fill="none" stroke="#ffd54f" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="365" cy="265" r="4" fill="#ffd54f"/>
    <path d="M425,170 Q430,220 435,260" fill="none" stroke="#ffd54f" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="435" cy="265" r="4" fill="#ffd54f"/>

    <!-- Torso and Sleeves -->
    <path d="M300,160 L360,160 L440,160 L500,160 L620,240 L560,330 L500,280 L500,450 L300,450 L300,280 L240,330 L180,240 Z" fill="url(#hoodieBody)" stroke="#1a6e49" stroke-width="2"/>

    <!-- Kangaroo Pocket in front -->
    <path d="M335,340 L465,340 L485,420 L315,420 Z" fill="#082b1d" stroke="#1d6645" stroke-width="1.5"/>

    <!-- Ribbed Waistband and Cuffs -->
    <rect x="300" y="440" width="200" height="24" rx="3" fill="#082b1d" stroke="#1a6e49" stroke-width="1"/>
    <polygon points="180,240 240,330 225,340 165,250" fill="none"/>
    <polygon points="560,330 620,240 635,250 575,340" fill="none"/>
    <!-- Cuff bands -->
    <rect x="222" y="318" width="24" height="18" rx="2" fill="#082b1d" transform="rotate(-35 234 327)"/>
    <rect x="554" y="318" width="24" height="18" rx="2" fill="#082b1d" transform="rotate(35 566 327)"/>

    <!-- Modern UPUAYA Screenprint Graphic on Center Chest -->
    <g transform="translate(400, 245)">
      <!-- Graphic Shield / Emblem -->
      <polygon points="0,-45 42,-22 42,20 0,45 -42,20 -42,-22" fill="#051c12" stroke="url(#gold10)" stroke-width="2"/>
      <text x="0" y="-8" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="url(#gold10)" text-anchor="middle" letter-spacing="2">UPUAYA</text>
      <text x="0" y="8" font-family="system-ui, sans-serif" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle" letter-spacing="3">NEXT-GEN</text>
      <polygon points="0,16 4,24 13,25 6,31 8,39 0,35 -8,39 -6,31 -13,25 -4,24" fill="url(#gold10)"/>
    </g>
  </g>

  <!-- Tag Pill -->
  <rect x="250" y="495" width="300" height="42" rx="21" fill="#000000" opacity="0.4"/>
  <rect x="250" y="495" width="300" height="42" rx="21" fill="none" stroke="#ffd54f" stroke-width="1.5"/>
  <text x="400" y="521" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffd54f" text-anchor="middle" letter-spacing="1">UPUAYA FLEECE HOODIE</text>
</svg>
