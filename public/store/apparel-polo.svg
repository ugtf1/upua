<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072b1d"/>
      <stop offset="50%" stop-color="#0b3824"/>
      <stop offset="100%" stop-color="#03170e"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145a3c"/>
      <stop offset="50%" stop-color="#0e3d26"/>
      <stop offset="100%" stop-color="#082819"/>
    </linearGradient>
    <linearGradient id="gold6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff099"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg6)"/>

  <!-- Halo backdrop -->
  <circle cx="400" cy="270" r="170" fill="#137459" opacity="0.3"/>

  <!-- Embroidered Polo Shirt Graphic -->
  <g filter="url(#shadow6)">
    <!-- Shirt Silhouette -->
    <!-- Torso and sleeves -->
    <path d="M290,140 L340,140 L370,180 L430,180 L460,140 L510,140 L600,210 L540,290 L490,250 L490,460 L310,460 L310,250 L260,290 L200,210 Z" fill="url(#shirtGrad)" stroke="#1a6e49" stroke-width="2"/>

    <!-- Gold sleeve cuff trim -->
    <polygon points="200,210 215,225 245,185 230,170" fill="none"/>
    <polygon points="200,210 260,290 250,298 190,218" fill="url(#gold6)"/>
    <polygon points="600,210 540,290 550,298 610,218" fill="url(#gold6)"/>

    <!-- Polo Placket & Collar -->
    <!-- Collar wings -->
    <polygon points="340,140 400,200 375,205 345,155" fill="#072417" stroke="url(#gold6)" stroke-width="1.5"/>
    <polygon points="460,140 400,200 425,205 455,155" fill="#072417" stroke="url(#gold6)" stroke-width="1.5"/>
    <!-- Collar neck rib -->
    <path d="M340,140 Q400,165 460,140" fill="none" stroke="url(#gold6)" stroke-width="3"/>

    <!-- Button Placket -->
    <rect x="388" y="195" width="24" height="85" rx="3" fill="#092d1d" stroke="#1a6e49" stroke-width="1"/>
    <!-- Pearl/Gold Buttons -->
    <circle cx="400" cy="215" r="4.5" fill="url(#gold6)"/>
    <circle cx="400" cy="240" r="4.5" fill="url(#gold6)"/>
    <circle cx="400" cy="265" r="4.5" fill="url(#gold6)"/>

    <!-- High-density Embroidered Crest on Left Chest -->
    <g transform="translate(435, 230)">
      <circle cx="20" cy="20" r="18" fill="#0b3323" stroke="url(#gold6)" stroke-width="2"/>
      <polygon points="20,8 24,16 33,17 26,24 28,33 20,28 12,33 14,24 7,17 16,16" fill="url(#gold6)"/>
      <circle cx="20" cy="20" r="3" fill="#ffffff"/>
    </g>

    <!-- Hem stitching detail -->
    <line x1="310" y1="445" x2="490" y2="445" stroke="#1a6e49" stroke-width="2" stroke-dasharray="6,4"/>
  </g>

  <!-- Tag Pill -->
  <rect x="250" y="495" width="300" height="42" rx="21" fill="#000000" opacity="0.4"/>
  <rect x="250" y="495" width="300" height="42" rx="21" fill="none" stroke="#ffd54f" stroke-width="1.5"/>
  <text x="400" y="521" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffd54f" text-anchor="middle" letter-spacing="1">HERITAGE CREST POLO SHIRT</text>
</svg>
