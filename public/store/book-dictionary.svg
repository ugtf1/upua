<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072b1d"/>
      <stop offset="50%" stop-color="#0b3824"/>
      <stop offset="100%" stop-color="#03160e"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145236"/>
      <stop offset="50%" stop-color="#0c3823"/>
      <stop offset="100%" stop-color="#062215"/>
    </linearGradient>
    <linearGradient id="gold7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff099"/>
      <stop offset="40%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="shadow7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="12" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg7)"/>

  <!-- Halo backdrop -->
  <circle cx="400" cy="270" r="170" fill="#137459" opacity="0.3"/>

  <!-- Hardcover Book Graphic -->
  <g filter="url(#shadow7)">
    <!-- Book Pages Edge (white block underneath) -->
    <polygon points="495,125 530,140 530,445 495,430" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Page lining lines -->
    <line x1="502" y1="135" x2="502" y2="435" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="512" y1="140" x2="512" y2="440" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="522" y1="145" x2="522" y2="445" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Book Bottom Pages Edge -->
    <polygon points="265,430 495,430 530,445 300,445" fill="#e2e8f0"/>

    <!-- Book Spine -->
    <path d="M235,110 L265,125 L265,430 L235,415 Z" fill="#08281a" stroke="#ffd54f" stroke-width="1.5"/>

    <!-- Front Cover -->
    <polygon points="265,125 500,125 500,430 265,430" fill="url(#bookCover)" stroke="url(#gold7)" stroke-width="2.5"/>

    <!-- Front Cover Inner Gold Embossed Border -->
    <rect x="280" y="140" width="205" height="275" rx="4" fill="none" stroke="url(#gold7)" stroke-width="1.5" opacity="0.75"/>
    <!-- Corner Ornaments -->
    <circle cx="288" cy="148" r="4" fill="url(#gold7)"/>
    <circle cx="477" cy="148" r="4" fill="url(#gold7)"/>
    <circle cx="288" cy="407" r="4" fill="url(#gold7)"/>
    <circle cx="477" cy="407" r="4" fill="url(#gold7)"/>

    <!-- Book Title & Emblems -->
    <circle cx="382" cy="210" r="30" fill="#092d1c" stroke="url(#gold7)" stroke-width="2"/>
    <polygon points="382,192 388,204 402,206 392,216 395,229 382,222 369,229 372,216 362,206 376,204" fill="url(#gold7)"/>

    <text x="382" y="270" font-family="system-ui, serif" font-weight="900" font-size="16" fill="url(#gold7)" text-anchor="middle" letter-spacing="2">COMPREHENSIVE</text>
    <text x="382" y="295" font-family="system-ui, serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="1">URHOBO</text>
    <text x="382" y="318" font-family="system-ui, serif" font-weight="800" font-size="14" fill="url(#gold7)" text-anchor="middle" letter-spacing="2">DICTIONARY</text>
    
    <line x1="332" y1="332" x2="432" y2="332" stroke="url(#gold7)" stroke-width="1.5"/>

    <text x="382" y="354" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#a3cfbb" text-anchor="middle" letter-spacing="1.5">LANGUAGE &amp; CULTURAL GUIDE</text>
    <text x="382" y="372" font-family="system-ui, sans-serif" font-weight="600" font-size="9" fill="#ffd54f" text-anchor="middle">UPUA HERITAGE SERIES</text>

    <!-- Silk Gold Bookmark Ribbon -->
    <polygon points="410,125 425,125 425,380 417,370 410,380" fill="#ffd54f" opacity="0.95"/>
  </g>

  <!-- Tag Pill -->
  <rect x="250" y="495" width="300" height="42" rx="21" fill="#000000" opacity="0.4"/>
  <rect x="250" y="495" width="300" height="42" rx="21" fill="none" stroke="#ffd54f" stroke-width="1.5"/>
  <text x="400" y="521" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffd54f" text-anchor="middle" letter-spacing="1">URHOBO-ENGLISH DICTIONARY</text>
</svg>
