<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="comboBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03160e"/>
      <stop offset="50%" stop-color="#0a3523"/>
      <stop offset="100%" stop-color="#020e08"/>
    </linearGradient>
    <linearGradient id="goldC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="50%" stop-color="#f5c037"/>
      <stop offset="100%" stop-color="#c98a08"/>
    </linearGradient>
    <linearGradient id="tshirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5c3b"/>
      <stop offset="100%" stop-color="#072d1d"/>
    </linearGradient>
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d9e2ec"/>
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24292e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="shadowC" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#comboBg)"/>

  <!-- Ambient Glow -->
  <circle cx="400" cy="270" r="240" fill="#157c52" opacity="0.32" filter="blur(45px)"/>

  <!-- Top Pill -->
  <g transform="translate(100, 60)">
    <rect width="210" height="34" rx="17" fill="#062316" stroke="url(#goldC)" stroke-width="1.5"/>
    <text x="105" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#f5c037" text-anchor="middle" letter-spacing="1.5">3-PIECE CONVENTION COMBO</text>
  </g>

  <!-- 1. T-Shirt (Center / Background Layer) -->
  <g filter="url(#shadowC)" transform="translate(290, 100)">
    <path d="M 60 40 Q 110 65 160 40 L 210 85 L 180 125 L 155 110 L 155 310 L 65 310 L 65 110 L 40 125 L 10 85 Z" fill="url(#tshirtGrad)" stroke="#268e5e" stroke-width="2"/>
    <path d="M 80 44 Q 110 70 140 44" fill="none" stroke="#3ec789" stroke-width="4"/>
    <!-- UPUA Crest on shirt -->
    <circle cx="110" cy="130" r="20" fill="#072d1d" stroke="#f5c037" stroke-width="1.5"/>
    <text x="110" y="134" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#f5c037" text-anchor="middle">UPUA</text>
    <text x="110" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">CONVENTION T-SHIRT</text>
  </g>

  <!-- 2. Bucket Hat / Cap (Left Foreground) -->
  <g filter="url(#shadowC)" transform="translate(110, 240) rotate(-8)">
    <!-- Bucket Hat Crown -->
    <path d="M 50 110 L 70 40 L 150 40 L 170 110 Z" fill="url(#hatGrad)" stroke="#484f58" stroke-width="1.5"/>
    <!-- Top crown ellipse -->
    <ellipse cx="110" cy="40" rx="40" ry="12" fill="#30363d"/>
    <!-- Brim -->
    <ellipse cx="110" cy="115" rx="78" ry="24" fill="url(#hatGrad)" stroke="#484f58" stroke-width="1.5"/>
    <!-- Hat Ribbon & Crest -->
    <path d="M 54 95 Q 110 110 166 95" fill="none" stroke="#f5c037" stroke-width="6"/>
    <circle cx="110" cy="75" r="14" fill="#0d1117" stroke="#f5c037" stroke-width="1"/>
    <text x="110" y="78" font-family="system-ui, sans-serif" font-size="7" font-weight="900" fill="#f5c037" text-anchor="middle">UPUA</text>
    <text x="110" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#f5c037" text-anchor="middle">CUSTOM HAT</text>
  </g>

  <!-- 3. Ceramic Mug (Right Foreground) -->
  <g filter="url(#shadowC)" transform="translate(530, 230) rotate(6)">
    <!-- Mug Body -->
    <rect x="25" y="40" width="105" height="120" rx="14" fill="url(#mugGrad)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Mug Handle -->
    <path d="M 130 65 Q 170 65 170 100 Q 170 135 130 135" fill="none" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/>
    <path d="M 130 65 Q 166 65 166 100 Q 166 135 130 135" fill="none" stroke="#0a3523" stroke-width="6" stroke-linecap="round"/>
    <!-- Rim -->
    <ellipse cx="77" cy="40" rx="52" ry="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <!-- Mug Graphic -->
    <circle cx="77" cy="98" r="22" fill="#0a3523" stroke="#f5c037" stroke-width="1.5"/>
    <text x="77" y="94" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#f5c037" text-anchor="middle">UPUA</text>
    <text x="77" y="106" font-family="system-ui, sans-serif" font-size="7" font-weight="800" fill="#ffffff" text-anchor="middle">2026</text>
    <text x="77" y="185" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#f5c037" text-anchor="middle">CERAMIC MUG</text>
  </g>

  <!-- Floating Center Price Star / Badge -->
  <g filter="url(#shadowC)" transform="translate(400, 360)">
    <circle r="68" fill="#061e13" stroke="url(#goldC)" stroke-width="3"/>
    <circle r="60" fill="none" stroke="#f5c037" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
    <text y="-22" font-family="system-ui, sans-serif" font-size="10.5" font-weight="900" fill="#f5c037" text-anchor="middle" letter-spacing="1">ALL 3 ITEMS</text>
    <text y="14" font-family="system-ui, sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">$50</text>
    <rect x="-44" y="24" width="88" height="20" rx="10" fill="#d4920b"/>
    <text y="38" font-family="system-ui, sans-serif" font-size="9.5" font-weight="900" fill="#04120b" text-anchor="middle">BEST VALUE</text>
  </g>

  <!-- Bottom Title Banner -->
  <g transform="translate(400, 530)">
    <rect x="-260" y="0" width="520" height="46" rx="23" fill="#000000" opacity="0.65"/>
    <rect x="-260" y="0" width="520" height="46" rx="23" fill="none" stroke="url(#goldC)" stroke-width="1.5"/>
    <text y="28" font-family="system-ui, sans-serif" font-weight="900" font-size="14.5" fill="#f5c037" text-anchor="middle" letter-spacing="1.5">1 HAT + 1 T-SHIRT + 1 MUG COMBO PACK</text>
  </g>
</svg>
