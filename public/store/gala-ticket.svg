<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="galaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03160e"/>
      <stop offset="50%" stop-color="#0b3824"/>
      <stop offset="100%" stop-color="#04120b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="40%" stop-color="#f5c037"/>
      <stop offset="75%" stop-color="#d4920b"/>
      <stop offset="100%" stop-color="#a67104"/>
    </linearGradient>
    <linearGradient id="ticketInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f442b"/>
      <stop offset="100%" stop-color="#072417"/>
    </linearGradient>
    <filter id="ticketShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#galaBg)"/>

  <!-- Ambient Golden Glow -->
  <circle cx="400" cy="285" r="240" fill="#157c52" opacity="0.3" filter="blur(40px)"/>
  <circle cx="260" cy="220" r="160" fill="#d4920b" opacity="0.12" filter="blur(30px)"/>

  <!-- Floating Sparkles -->
  <g opacity="0.45" fill="#f5c037">
    <circle cx="140" cy="120" r="3"/>
    <circle cx="210" cy="80" r="2"/>
    <circle cx="680" cy="110" r="3"/>
    <circle cx="720" cy="200" r="2"/>
    <circle cx="110" cy="460" r="2.5"/>
    <circle cx="690" cy="480" r="3"/>
    <polygon points="390,90 393,98 401,101 393,104 390,112 387,104 379,101 387,98" fill="#ffd866" opacity="0.7"/>
    <polygon points="630,420 632,426 638,428 632,430 630,436 628,430 622,428 628,426" fill="#ffd866" opacity="0.6"/>
  </g>

  <!-- Ticket Body with Rotation and Drop Shadow -->
  <g filter="url(#ticketShadow)">
    <!-- Outer Golden Border -->
    <rect x="110" y="145" width="580" height="280" rx="18" fill="url(#goldGrad)"/>
    <!-- Inner Dark Slate Card -->
    <rect x="114" y="149" width="572" height="272" rx="15" fill="url(#ticketInner)"/>

    <!-- Subtle guilloche ornament lines -->
    <rect x="126" y="161" width="548" height="248" rx="10" fill="none" stroke="#d4920b" stroke-width="1" opacity="0.4"/>
    <rect x="130" y="165" width="540" height="240" rx="8" fill="none" stroke="#f5c037" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>

    <!-- Stub Perforation Line -->
    <line x1="515" y1="149" x2="515" y2="421" stroke="#d4920b" stroke-width="2" stroke-dasharray="8,6" opacity="0.8"/>
    <!-- Perforation Cutout Circles -->
    <circle cx="515" cy="149" r="16" fill="#04120b"/>
    <circle cx="515" cy="421" r="16" fill="#04120b"/>

    <!-- ================= LEFT SECTION (MAIN PASS) ================= -->
    <!-- UPUA Crest Badge -->
    <circle cx="195" cy="225" r="36" fill="#092d1c" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Crown / Urhobo Icon in Badge -->
    <path d="M177 236 L181 216 L195 224 L209 216 L213 236 Z" fill="url(#goldGrad)"/>
    <circle cx="181" cy="214" r="2.5" fill="#ffffff"/>
    <circle cx="195" cy="221" r="2.5" fill="#ffffff"/>
    <circle cx="209" cy="214" r="2.5" fill="#ffffff"/>
    <rect x="178" y="238" width="34" height="3" rx="1.5" fill="url(#goldGrad)"/>

    <!-- Header Titles -->
    <text x="245" y="200" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11.5" fill="#f5c037" letter-spacing="2">33RD ANNUAL UPUA NATIONAL CONVENTION</text>
    <text x="245" y="228" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="1">GRAND CULTURAL GALA</text>
    <text x="245" y="248" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#a4d7be" letter-spacing="0.5">&amp; ROYAL AWARDS BANQUET NIGHT</text>

    <!-- Event Info Box -->
    <rect x="155" y="278" width="335" height="112" rx="10" fill="#061d13" stroke="#1c6643" stroke-width="1.2"/>

    <g transform="translate(172, 298)">
      <text font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#f5c037" letter-spacing="1">DATE &amp; TIME</text>
      <text y="18" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Saturday, Sept 5, 2026 &bull; 6:00 PM EST</text>

      <text y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#f5c037" letter-spacing="1">VENUE</text>
      <text y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">DoubleTree by Hilton Grand Ballroom</text>
      <text y="75" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">51 Walnut St, Lawrenceburg, IN 47025</text>
    </g>

    <!-- ================= RIGHT SECTION (STUB / PRICING) ================= -->
    <g transform="translate(600, 175)">
      <text font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#f5c037" text-anchor="middle" letter-spacing="2">OFFICIAL PASS</text>

      <!-- Adult Price Pill -->
      <rect x="-65" y="15" width="130" height="42" rx="8" fill="#092d1c" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <text y="32" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#a4d7be" text-anchor="middle">ADULT PASS</text>
      <text y="49" font-family="system-ui, sans-serif" font-size="17" font-weight="900" fill="#ffffff" text-anchor="middle">$150</text>

      <!-- Child Price Pill -->
      <rect x="-65" y="65" width="130" height="38" rx="8" fill="#061d13" stroke="#257a53" stroke-width="1"/>
      <text y="80" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#f5c037" text-anchor="middle">CHILD (3-12 YRS)</text>
      <text y="95" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">$50</text>

      <!-- Barcode Graphic -->
      <g transform="translate(-52, 115)" opacity="0.85" fill="#ffffff">
        <rect x="0" y="0" width="2" height="38"/>
        <rect x="5" y="0" width="4" height="38"/>
        <rect x="12" y="0" width="1.5" height="38"/>
        <rect x="16" y="0" width="5" height="38"/>
        <rect x="24" y="0" width="2" height="38"/>
        <rect x="29" y="0" width="6" height="38"/>
        <rect x="38" y="0" width="3" height="38"/>
        <rect x="44" y="0" width="1.5" height="38"/>
        <rect x="48" y="0" width="5" height="38"/>
        <rect x="56" y="0" width="2" height="38"/>
        <rect x="61" y="0" width="6" height="38"/>
        <rect x="70" y="0" width="3" height="38"/>
        <rect x="76" y="0" width="2" height="38"/>
        <rect x="81" y="0" width="5" height="38"/>
        <rect x="89" y="0" width="3" height="38"/>
        <rect x="95" y="0" width="4" height="38"/>
        <rect x="102" y="0" width="2" height="38"/>
      </g>
      <text y="165" font-family="monospace" font-size="9" font-weight="700" fill="#f5c037" text-anchor="middle">UPUA-GALA-2026</text>
    </g>
  </g>

  <!-- Bottom Badge Tag -->
  <g transform="translate(400, 485)">
    <rect x="-180" y="0" width="360" height="38" rx="19" fill="#000000" opacity="0.6"/>
    <rect x="-180" y="0" width="360" height="38" rx="19" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text y="24" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#f5c037" text-anchor="middle" letter-spacing="1.5">ROYAL BANQUET &bull; LIVE DANCE &bull; AWARDS</text>
  </g>
</svg>
